[package]
name = "sqlqs"
version = "0.3.3"
description = "SQL Query Studio"
authors = ["Cristian Militaru"]
edition = "2021"

[lib]
name = "sqlqs_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "sql-browser-tokio", "winauth", "chrono", "rust_decimal"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["compat"] }
dirs = "6"
tauri-plugin-fs = "2.5.0"
tauri-plugin-notification = "2"
rust_xlsxwriter = "0.78"
socket2 = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(not(windows))'.dependencies]
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Globalization"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
