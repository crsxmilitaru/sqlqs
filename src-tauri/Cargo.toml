[package]
name = "sqlqs"
version = "0.5.0"
description = "SQL Query Studio"
authors = ["Cristian Militaru"]
edition = "2021"

[lib]
name = "sqlqs_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-snap-layout = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tokio-util = { version = "0.7" }
dirs = "6"
tauri-plugin-fs = "2.5.0"
tauri-plugin-notification = "2"
rust_xlsxwriter = "0.78"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
thiserror = "2"
url = "2"
arboard = "3"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-single-instance = "2"


[target.'cfg(not(windows))'.dependencies]
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_Globalization", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }

