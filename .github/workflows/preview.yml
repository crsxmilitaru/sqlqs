name: Preview

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: preview-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare preview release
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.preview.outputs.release-version }}
      release-tag: ${{ steps.preview.outputs.release-tag }}
      changelog: ${{ steps.preview.outputs.changelog }}
    steps:
      - name: Checkout preview version
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare preview tag and changelog
        id: preview
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION="$(node -e "const fs = require('fs'); console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview$ ]]; then
            echo "::error::Current package version must be a preview version, got: $VERSION"
            exit 1
          fi

          PREVIEW_TAGS="$(
            gh api --paginate "repos/$REPOSITORY/releases" \
              --jq '.[] | select(.prerelease == true) | .tag_name' \
              || true
          )"

          NEXT_NUMBER=1
          PREV_TAG=""
          while IFS= read -r EXISTING_TAG; do
            [ -z "$EXISTING_TAG" ] && continue
            SUFFIX="${EXISTING_TAG#v${VERSION}.}"
            if [[ "$SUFFIX" == "$EXISTING_TAG" ]] || [[ ! "$SUFFIX" =~ ^[0-9]+$ ]]; then
              continue
            fi
            if [ "$SUFFIX" -ge "$NEXT_NUMBER" ]; then
              NEXT_NUMBER=$((SUFFIX + 1))
              PREV_TAG="$EXISTING_TAG"
            fi
          done <<< "$PREVIEW_TAGS"

          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="$(
              printf '%s\n' "$PREVIEW_TAGS" \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-preview(\.[0-9]+){0,2}$' \
                | sort -V \
                | tail -n 1 \
                || true
            )"
          fi

          TAG_NAME="v$VERSION.$NEXT_NUMBER"
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG="$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" | grep -viE "^- (preview|bump version|v[0-9])" || true)"
          else
            CHANGELOG="$(git log -n 10 --pretty=format:"- %s (%h)" | grep -viE "^- (preview|bump version|v[0-9])" || true)"
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Routine update"
          fi

          git tag "$TAG_NAME" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG_NAME"

          echo "release-version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release-tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  preview:
    name: Preview (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release-version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
      SQLQS_BUILD_COMMIT: ${{ github.sha }}
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_P8 != '' }}
      HAS_APPLE_NOTARIZATION: ${{ (secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_P8 != '') || (secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '') }}
      HAS_APPLE_RELEASE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && ((secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_P8 != '') || (secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '')) }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout preview version
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version
        shell: bash
        run: |
          VERSION="${{ env.RELEASE_VERSION }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview$ ]]; then
            echo "::error::Invalid preview version: $VERSION"
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate changelog
        id: changelog
        shell: bash
        env:
          CHANGELOG_BODY: ${{ needs.prepare.outputs.changelog }}
        run: |
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG_BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Resolve sidecar target triple
        shell: bash
        run: |
          echo "SQLQS_SIDECAR_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build sidecar
        run: npm run sidecar:build

      - name: Run frontend lint
        run: npm run lint

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Prepare App Store Connect API key
        if: matrix.os == 'macos-latest' && env.HAS_APPLE_API_KEY == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          cat > "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8" <<'EOF'
          ${{ secrets.APPLE_API_KEY_P8 }}
          EOF
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8" >> "$GITHUB_ENV"

      - name: Warn when macOS signing secrets are missing
        if: matrix.os == 'macos-latest' && env.HAS_APPLE_CERTIFICATE != 'true'
        run: echo "::warning::APPLE_CERTIFICATE/APPLE_CERTIFICATE_PASSWORD are not configured. The macOS preview will be ad-hoc signed only; users will need to right-click the app and choose Open the first time."

      - name: Warn when macOS notarization secrets are missing
        if: matrix.os == 'macos-latest' && env.HAS_APPLE_NOTARIZATION != 'true'
        run: echo "::warning::No Apple notarization credentials were provided. The macOS preview will fall back to ad-hoc signing so users can still install it via the one-time Open flow."

      - name: Build and upload preview assets
        if: matrix.os != 'macos-latest' || env.HAS_APPLE_RELEASE_SIGNING == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "SQL Query Studio ${{ env.RELEASE_TAG }}"
          releaseBody: "${{ steps.changelog.outputs.changelog }}"
          releaseDraft: false
          prerelease: true
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}'
          includeUpdaterJson: true

      - name: Build and upload ad-hoc signed macOS preview assets
        if: matrix.os == 'macos-latest' && env.HAS_APPLE_RELEASE_SIGNING != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "SQL Query Studio ${{ env.RELEASE_TAG }}"
          releaseBody: "${{ steps.changelog.outputs.changelog }}"
          releaseDraft: false
          prerelease: true
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}'
          includeUpdaterJson: true
